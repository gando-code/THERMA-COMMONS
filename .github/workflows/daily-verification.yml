name: Daily research verification

on:
  schedule:
    - cron: '23 15 * * *'
  workflow_dispatch:
  push:
    branches: [main, thermaverification]
    paths:
      - '.github/workflows/daily-verification.yml'
      - 'src/therma_commons/verification.py'
      - 'tests/test_verification.py'

permissions:
  contents: read

concurrency:
  group: daily-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run research tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic verification
        run: |
          python -m therma_commons.verification --seed "$(date -u +%Y%m%d)" --output local-results/verification.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("local-results/verification.json").read_text())
          print("## Synthetic verification")
          print(report["classification"])
          print(f"\nSeed: {report['seed']}. Draws per regime: {report['draws_per_regime']}.")
          print(f"\nReadiness model transitions checked: {report['readiness_logic']['transitions']}.")
          print("\n| Regime | rNPV P01 | rNPV P50 | rNPV P99 |")
          print("|---|---:|---:|---:|")
          for name, regime in report["regimes"].items():
              values = regime["quantiles"]["rnpv_usd"]
              print(f"| {name.title()} | {values['p01']:,.0f} | {values['p50']:,.0f} | {values['p99']:,.0f} |")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-verification
          path: local-results/verification.json
          if-no-files-found: error
          retention-days: 30
