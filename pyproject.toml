[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "therma-commons"
version = "0.1.0"
description = "Research simulation and measurement analysis for precision thermal workflows"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
therma-commons = "therma_commons.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
documents = ["reportlab>=4,<5", "pypdf>=5,<7"]
